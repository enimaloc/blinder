<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="top(title, items)" th:unless="${items.isEmpty()}">
    <h2 th:text="${title}"></h2>
    <table>
        <tr th:each="c : ${items}"><td th:text="${c.label()}"></td><td th:text="${c.count()}"></td></tr>
    </table>
</section>
</body>
</html>
