<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Liens')}"></head>
<body>
<nav th:replace="~{admin/fragments :: nav}"></nav>
<main>
    <h1>Liens</h1>
    <p class="notice" th:if="${warning}" th:text="${warning}"></p>
    <p th:if="${domains.isEmpty()}" class="notice">
        Ajoutez d'abord un <a th:href="@{/_/domains/new}">domaine</a>.
    </p>
    <p th:unless="${domains.isEmpty()}"><a th:href="@{/_/links/new}">Nouveau lien</a></p>
    <form method="get" th:action="@{/_/}" th:unless="${domains.isEmpty()}">
        <label for="domain">Filtrer par domaine</label>
        <select id="domain" name="domain" onchange="this.form.submit()">
            <option value="">Tous</option>
            <option th:each="d : ${domains}" th:value="${d.id}" th:text="${d.host}"
                    th:selected="${d.id == selectedDomain}"></option>
        </select>
        <label for="tag">Filtrer par tag</label>
        <select id="tag" name="tag" onchange="this.form.submit()">
            <option value="">Tous</option>
            <option th:each="t : ${allTags}" th:value="${t.id}" th:text="${t.name}"
                    th:selected="${t.id == selectedTag}"></option>
        </select>
    </form>
    <table>
        <tr><th>Lien</th><th>Cible</th><th>Tags</th><th>État</th><th>Utilisations</th><th></th></tr>
        <tr th:each="row : ${rows}">
            <td><a th:href="@{/_/links/{id}(id=${row.link.id})}"
                   th:text="${row.link.domain.host} + '/' + ${row.link.slug}"></a></td>
            <td th:text="${row.link.targetUrl}"></td>
            <td>
                <a th:each="t : ${row.tags}" class="tag" th:text="${t.name}"
                   th:style="${t.color} != null ? '--tag-color: ' + ${t.color} + '; --tag-text: ' + ${t.textColor()}"
                   th:href="${selectedDomain != null} ? @{/_/(tag=${t.id},domain=${selectedDomain})} : @{/_/(tag=${t.id})}"></a>
            </td>
            <td><span th:class="'badge badge-' + ${#strings.toLowerCase(row.status.name())}"
                      th:text="${row.status.label()}"></span></td>
            <td th:text="${row.link.maxUses == null} ? ${row.link.useCount} : ${row.link.useCount} + ' / ' + ${row.link.maxUses}"></td>
            <td><a th:href="@{/_/links/{id}/stats(id=${row.link.id})}">Stats</a></td>
        </tr>
    </table>
</main>
</body>
</html>
