# Profil de production (l'image active SPRING_PROFILES_ACTIVE=prod,postgres).
# Base, mots de passe et SMTP : uniquement par variables d'environnement (SPRING_DATASOURCE_*, SPRING_MAIL_*).

# --- Cookie de session : jamais en clair, jamais envoyé en contexte tiers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# --- Arrêt propre : les requêtes en cours se terminent (la file des visites est vidée à l'arrêt)
server.shutdown=graceful

# --- Proxys de confiance : surcharger par SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (regex, sous-réseau du proxy)
server.tomcat.remoteip.internal-proxies=${SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES:127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1}
