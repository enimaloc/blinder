spring.application.name=blinder

# --- Base par défaut : H2 fichier (profils "sqlite" et "postgres" disponibles)
spring.datasource.url=jdbc:h2:file:./data/blinder
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- Data REST : rien d'exposé, et jamais à la racine (conflit avec les slugs)
spring.data.rest.base-path=/_/api
spring.data.rest.detection-strategy=annotated

# --- Derrière un reverse proxy : Host / X-Forwarded-For d'origine
server.forward-headers-strategy=framework

# --- Blinder (valeurs par défaut dans BlinderProperties)
# blinder.admin.domain=admin.example.com
# blinder.admin.time-zone=Europe/Paris
