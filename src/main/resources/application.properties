spring.application.name=blinder

# --- Base par défaut : H2 fichier (profils "sqlite" et "postgres" disponibles)
spring.datasource.url=jdbc:h2:file:./data/blinder
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- Data REST : rien d'exposé, et jamais à la racine (conflit avec les slugs)
spring.data.rest.base-path=/_/api
spring.data.rest.detection-strategy=annotated

# --- Derrière un reverse proxy : RemoteIpValve Tomcat. Seuls les proxys listés peuvent fixer
# l'IP client (X-Forwarded-For) et le host (X-Forwarded-Host). Défaut : loopback uniquement ;
# élargir en production (regex), ex. 10\\.0\\.0\\.\\d{1,3}
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1
server.tomcat.remoteip.host-header=X-Forwarded-Host

# --- Blinder (valeurs par défaut dans BlinderProperties)
# blinder.admin.domain=admin.example.com
# blinder.admin.time-zone=Europe/Paris

# --- Pages d'erreur : jamais de détail technique
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# --- Statistiques (valeurs par défaut dans StatsProperties) ; retention=0 : illimitée
# blinder.stats.retention=90d
# blinder.stats.queue-capacity=10000
# blinder.stats.flush-interval=1s
# --- Géolocalisation : base MaxMind GeoLite2 City ou Country (.mmdb), absente = désactivée
# blinder.geoip.database=/var/lib/geoip/GeoLite2-City.mmdb
# --- Notifications (valeurs par défaut dans NotificationProperties) ; SMTP via spring.mail.*
# blinder.notifications.mail-from=blinder@localhost
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtps.connectiontimeout=5000
spring.mail.properties.mail.smtps.timeout=5000
spring.mail.properties.mail.smtps.writetimeout=5000
# blinder.notifications.denials.threshold=10
# blinder.notifications.denials.window=10m
# blinder.notifications.denials.cooldown=1h

# --- Tâches planifiées : plusieurs threads pour qu'un envoi lent ne bloque pas la purge ni l'expiration
spring.task.scheduling.pool.size=3
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=10s
