# Le dossier ./data est créé au démarrage (DatabaseDirectoryPostProcessor).
# Pragmas passés dans l'URL : Hikari n'exécute qu'une instruction d'init.
spring.datasource.url=jdbc:sqlite:./data/blinder.sqlite?journal_mode=WAL&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=fr.enimaloc.blinder.common.persistence.BlinderSqliteDialect
