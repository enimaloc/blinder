name: CI

on:
  # Branches principales seulement : les autres branches passent par leur pull request (pas de double exécution).
  push:
    branches: [main, master]
  pull_request:
  # Réutilisé par release.yml pour ne pas dupliquer la définition des tests.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # PostgreSQL est lancé par Testcontainers sur le Docker du runner.
      - run: ./gradlew test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/test
